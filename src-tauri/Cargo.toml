[package]
name = "gemini-router"
version = "0.1.1"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
futures-util = "0.3.34"
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
rand = "0.10.3"
# TLS is delegated to the OS (schannel on Windows) so the build needs no C
# compiler / NASM. Do NOT re-add the `rustls` feature here: it pulls in
# aws-lc-sys, which requires CMake + NASM to assemble on Windows.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["cors"] }
uuid = { version = "1.28.0", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
